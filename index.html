<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partits C.E. Llinars — Erik & Biel</title>

  <!-- Configuración App Web iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Llinars FC">
  <link rel="apple-touch-icon" href="https://www.fcf.cat/img/escudos/club_08027.png">
  <link rel="shortcut icon" href="https://www.fcf.cat/img/escudos/club_08027.png">

  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding: 12px;
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.25rem;
      color: var(--primary);
      font-weight: 800;
      line-height: 1.2;
    }

    .block-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .block-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .block-badge {
      background: #dbeafe;
      color: var(--secondary);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .match-item {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .match-item:last-child {
      margin-bottom: 0;
    }

    .player-tag {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .match-vs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .team img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .team span {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .vs-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      background: white;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .match-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .detail-row a {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
    }

    .load-more-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://www.fcf.cat/img/escudos/club_08027.png" alt="C.E. Llinars Escudo">
    <h1>C.E. Llinars<br><span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);">Erik i Biel</span></h1>
  </header>

  <main id="app-container">
    <div style="text-align:center; padding: 20px; color: var(--text-muted);">Carregant partits...</div>
  </main>

  <button id="btn-more" class="load-more-btn hidden" onclick="mostrarMesPartits()">Ver Más Jornadas</button>

  <script>
    async function cargarPartidos() {
      try {
        const response = await fetch('partidos.json?v=' + new Date().getTime());
        const todosLosPartidos = await response.json();
        const agrupados = agruparPorBloque(todosLosPartidos);
        renderizarPartidos(agrupados);
      } catch (e) {
        document.getElementById('app-container').innerHTML = `
          <div style="text-align:center; color:red; padding: 20px;">
            Error al cargar los partidos.
          </div>`;
      }
    }

    function agruparPorBloque(partidos) {
      const bloques = {};
      partidos.forEach(p => {
        let key = p.fecha || "Próximos Partidos";
        if (p.fecha && p.fecha.includes('/')) {
          const partes = p.fecha.split('/');
          const d = new Date(partes[2], partes[1] - 1, partes[0]);
          const diaSemana = d.getDay();

          if (diaSemana === 6 || diaSemana === 0) {
            const sabado = new Date(d);
            if (diaSemana === 0) sabado.setDate(sabado.getDate() - 1);
            key = `Fin de Semana (${sabado.getDate()}/${sabado.getMonth()+1})`;
          } else {
            const diasNom = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            key = `${diasNom[diaSemana]} ${p.fecha}`;
          }
        }

        if (!bloques[key]) bloques[key] = [];
        bloques[key].push(p);
      });
      return bloques;
    }

    function renderizarPartidos(bloques) {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      const keys = Object.keys(bloques);
      if (keys.length === 0) {
        container.innerHTML = '<div style="text-align:center;">No hay partidos programados.</div>';
        return;
      }

      keys.forEach((tituloBloque, index) => {
        const partidosBloque = bloques[tituloBloque];
        const card = document.createElement('div');
        card.className = `block-card ${index >= 2 ? 'extra-card hidden' : ''}`;

        let partidosHtml = partidosBloque.map(p => {
          const mapaUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.campo)}`;
          return `
            <div class="match-item">
              <span class="player-tag">${p.jugador} (${p.categoria})</span>
              <div class="match-vs">
                <div class="team">
                  <img src="${p.escudo_local}" alt="${p.equipo_local}">
                  <span>${p.equipo_local}</span>
                </div>
                <div class="vs-badge">VS</div>
                <div class="team">
                  <img src="${p.escudo_visitante}" alt="${p.equipo_visitante}">
                  <span>${p.equipo_visitante}</span>
                </div>
              </div>
              <div class="match-details">
                <div class="detail-row">📅 <b>Fecha:</b> ${p.fecha} ${p.hora ? 'a las ' + p.hora + ' h' : ''}</div>
                <div class="detail-row">📍 <b>Campo:</b> <a href="${mapaUrl}" target="_blank">${p.campo}</a></div>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="block-header">
            <div class="block-title">📅 ${tituloBloque}</div>
            <span class="block-badge">${partidosBloque.length} ${partidosBloque.length > 1 ? 'Partidos' : 'Partido'}</span>
          </div>
          ${partidosHtml}
        `;

        container.appendChild(card);
      });

      if (keys.length > 2) {
        document.getElementById('btn-more').classList.remove('hidden');
      }
    }

    function mostrarMesPartits() {
      const extras = document.querySelectorAll('.extra-card');
      extras.forEach(el => el.classList.remove('hidden'));
      document.getElementById('btn-more').classList.add('hidden');
    }

    cargarPartidos();
  </script>
</body>
</html>
