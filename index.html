<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">
<title>Agenda Partidos C.E. Llinars</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L85 25 L85 75 L50 90 L15 75 L15 25 Z' fill='%231e3a8a' stroke='%23fbbf24' stroke-width='2'/%3E%3Ctext x='50' y='55' text-anchor='middle' font-size='14' font-weight='bold' fill='white'%3ELLINARS%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 1rem;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    text-align: center;
    padding: 2rem 1rem;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    border-radius: 16px;
    margin-bottom: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  header h1 {
    font-size: 1.8rem;
    color: white;
    margin-bottom: 0.5rem;
  }
  header p {
    color: #bfdbfe;
    font-size: 0.95rem;
  }
  .filters {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .filter-btn {
    padding: 0.6rem 1.2rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #e2e8f0;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s;
  }
  .filter-btn:hover { background: rgba(255,255,255,0.2); }
  .filter-btn.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
  }
  .partidos-grid {
    display: grid;
    gap: 1rem;
  }
  .partido-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 1.2rem;
    transition: all 0.3s;
  }
  .partido-card:hover {
    transform: translateY(-2px);
    border-color: rgba(59, 130, 246, 0.5);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .partido-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .jugador-badge {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .jornada-badge {
    background: rgba(251, 191, 36, 0.2);
    color: #fbbf24;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .partido-content {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1rem;
    align-items: center;
    margin-bottom: 1rem;
  }
  .equipo {
    text-align: center;
  }
  .equipo.local { text-align: right; }
  .equipo.visitante { text-align: left; }
  .escudo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-bottom: 0.5rem;
    background: white;
    border-radius: 8px;
    padding: 4px;
  }
  .escudo-fallback {
    width: 60px;
    height: 60px;
    margin: 0 auto 0.5rem;
    background: white;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .escudo-fallback svg {
    width: 50px;
    height: 50px;
  }
  .equipo-nombre {
    font-size: 0.85rem;
    color: #cbd5e1;
    line-height: 1.3;
  }
  .vs {
    font-size: 1.2rem;
    font-weight: bold;
    color: #64748b;
  }
  .partido-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.8rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: #94a3b8;
  }
  .info-item i {
    color: #60a5fa;
    width: 16px;
  }
  .loading {
    text-align: center;
    padding: 3rem;
    color: #94a3b8;
  }
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  .empty {
    text-align: center;
    padding: 3rem;
    color: #94a3b8;
  }
  @media (max-width: 600px) {
    .partido-content {
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
    .equipo.local, .equipo.visitante { text-align: center; }
    .vs { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚽ Agenda C.E. Llinars</h1>
    <p>Calendari de partits - Temporada 2026-2027</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="todos">Tots</button>
    <button class="filter-btn" data-filter="Erik">Erik (Infantil A)</button>
    <button class="filter-btn" data-filter="Biel">Biel (Benjamí B)</button>
  </div>

  <div id="contenido">
    <div class="loading">Carregant partits...</div>
  </div>
</div>

<script>
// Escudo SVG del C.E. Llinars como fallback
const ESCUDO_LLINARS_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path d="M50 10 L85 25 L85 75 L50 90 L15 75 L15 25 Z" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="20" y="30" width="30" height="20" fill="#3b82f6"/>
  <rect x="50" y="30" width="30" height="20" fill="#fbbf24"/>
  <rect x="20" y="50" width="30" height="20" fill="#ef4444"/>
  <rect x="50" y="50" width="30" height="20" fill="#1e3a8a"/>
  <text x="50" y="65" text-anchor="middle" font-size="8" font-weight="bold" fill="white">LLINARS</text>
  <path d="M45 20 L50 15 L55 20 L55 25 L45 25 Z" fill="#fbbf24"/>
</svg>`;

let partidosData = [];
let filtroActual = 'todos';

// Función para limpiar claves con espacios
function limpiarClaves(obj) {
  if (Array.isArray(obj)) {
    return obj.map(limpiarClaves);
  }
  if (typeof obj === 'object' && obj !== null) {
    const limpio = {};
    for (const [clave, valor] of Object.entries(obj)) {
      limpio[clave.trim()] = limpiarClaves(valor);
    }
    return limpio;
  }
  return obj;
}

async function cargarPartidos() {
  try {
    const res = await fetch('partidos.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Limpiar espacios en las claves
    partidosData = limpiarClaves(data);
    renderizarPartidos();
  } catch (err) {
    document.getElementById('contenido').innerHTML = `
      <div class="error">
        <strong>Error carregant partits:</strong> ${err.message}<br>
        <small>Verifica que partidos.json existeix i té el format correcte.</small>
      </div>`;
  }
}

function renderizarPartidos() {
  const contenido = document.getElementById('contenido');
  
  let partidosFiltrados = partidosData;
  if (filtroActual !== 'todos') {
    partidosFiltrados = partidosData.filter(p => p.jugador === filtroActual);
  }

  if (partidosFiltrados.length === 0) {
    contenido.innerHTML = '<div class="empty">No hi ha partits per mostrar</div>';
    return;
  }

  const html = partidosFiltrados.map(p => {
    const fecha = new Date(p.fecha);
    const fechaStr = fecha.toLocaleDateString('ca-ES', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    
    return `
      <div class="partido-card">
        <div class="partido-header">
          <span class="jugador-badge">${p.jugador} - ${p.categoria}</span>
          <span class="jornada-badge">Jornada ${p.jornada}</span>
        </div>
        <div class="partido-content">
          <div class="equipo local">
            <img src="${p.escudo_local}" 
                 alt="${p.equipo_local}" 
                 class="escudo"
                 onerror="this.outerHTML='<div class=\\'escudo-fallback\\'>${ESCUDO_LLINARS_SVG}</div>'">
            <div class="equipo-nombre">${p.equipo_local}</div>
          </div>
          <div class="vs">VS</div>
          <div class="equipo visitante">
            <img src="${p.escudo_visitante}" 
                 alt="${p.equipo_visitante}" 
                 class="escudo"
                 onerror="this.outerHTML='<div class=\\'escudo-fallback\\'>${ESCUDO_LLINARS_SVG}</div>'">
            <div class="equipo-nombre">${p.equipo_visitante}</div>
          </div>
        </div>
        <div class="partido-info">
          <div class="info-item"> ${fechaStr}</div>
          <div class="info-item">🕐 ${p.hora}</div>
          <div class="info-item">📍 ${p.campo}</div>
          <div class="info-item">${p.es_local ? '🏠 Local' : '️ Visitant'}</div>
        </div>
      </div>
    `;
  }).join('');

  contenido.innerHTML = `<div class="partidos-grid">${html}</div>`;
}

// Filtros
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.filter;
    renderizarPartidos();
  });
});

// Cargar al iniciar
cargarPartidos();
</script>
</body>
</html>
