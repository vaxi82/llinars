<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.E. Llinars — Erik & Biel</title>

  <!-- WebApp Config para iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Llinars FC">
  <link rel="apple-touch-icon" href="https://www.fcf.cat/img/escudos/club_08027.png">
  <link rel="shortcut icon" href="https://www.fcf.cat/img/escudos/club_08027.png">

  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-dark); padding: 12px; max-width: 800px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding: 12px;
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    header img { width: 42px; height: 42px; object-fit: contain; }
    header h1 { font-size: 1.2rem; color: var(--primary); font-weight: 800; }

    .weekend-block {
      background: #e2e8f0;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .weekend-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Pareja de Tarjetas en paralelo (Sábado y Domingo) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .day-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      align-self: flex-start;
    }

    .player-name {
      font-weight: 700;
      color: var(--secondary);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .match-vs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
    }
    .team img { width: 45px; height: 45px; object-fit: contain; }
    .team span { font-size: 0.8rem; font-weight: 600; line-height: 1.1; }

    .vs-circle {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .details {
      border-top: 1px solid #f1f5f9;
      padding-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .details a { color: var(--secondary); text-decoration: none; font-weight: 600; }

    .load-more-btn {
      width: 100%;
      padding: 12px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <img src="https://www.fcf.cat/img/escudos/club_08027.png" alt="Escudo Llinars">
    <h1>C.E. Llinars<br><span style="font-size:0.85rem; font-weight:normal; color:var(--text-muted);">Erik i Biel</span></h1>
  </header>

  <main id="app-container">
    <div style="text-align:center; padding:20px;">Carregant partits...</div>
  </main>

  <button id="btn-more" class="load-more-btn hidden" onclick="mostrarMes()">Ver Próximos Fines de Semana</button>

  <script>
    async function cargarPartidos() {
      try {
        const response = await fetch('partidos.json?v=' + new Date().getTime());
        const partidos = await response.json();
        renderizar(partidos);
      } catch (e) {
        document.getElementById('app-container').innerHTML = '<div style="text-align:center; color:red;">Error en carregar els partits.</div>';
      }
    }

    function renderizar(partidos) {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      // Agrupar por Fines de semana / Bloques
      const bloques = {};
      partidos.forEach(p => {
        let key = "Pròxims Partits";
        if (p.fecha && p.fecha.includes('/')) {
          const [d, m, y] = p.fecha.split('/');
          const dateObj = new Date(y, m - 1, d);
          const diaSemana = dateObj.getDay();

          if (diaSemana === 6 || diaSemana === 0) {
            const sab = new Date(dateObj);
            if (diaSemana === 0) sab.setDate(sab.getDate() - 1);
            key = `Cap de Setmana (${sab.getDate()}/${sab.getMonth()+1})`;
          } else {
            key = `Entre Setmana (${p.fecha})`;
          }
        }

        if (!bloques[key]) bloques[key] = [];
        bloques[key].push(p);
      });

      const keys = Object.keys(bloques);

      keys.forEach((bloqueKey, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = `weekend-block ${idx >= 1 ? 'extra-block hidden' : ''}`;

        let cardsHtml = bloques[bloqueKey].map(p => {
          const mapaUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.campo)}`;
          return `
            <div class="match-card">
              <div>
                <span class="day-badge">${p.fecha}</span>
                <div class="player-name">${p.jugador} (${p.categoria})</div>
                <div class="match-vs">
                  <div class="team">
                    <img src="${p.escudo_local}" alt="${p.equipo_local}">
                    <span>${p.equipo_local}</span>
                  </div>
                  <div class="vs-circle">VS</div>
                  <div class="team">
                    <img src="${p.escudo_visitante}" alt="${p.equipo_visitante}">
                    <span>${p.equipo_visitante}</span>
                  </div>
                </div>
              </div>
              <div class="details">
                <div>⏰ <b>Hora:</b> ${p.hora ? p.hora + ' h' : 'Per determinar'}</div>
                <div>📍 <b>Camp:</b> <a href="${mapaUrl}" target="_blank">${p.campo}</a></div>
              </div>
            </div>
          `;
        }).join('');

        wrapper.innerHTML = `
          <div class="weekend-title">📅 ${bloqueKey}</div>
          <div class="cards-grid">${cardsHtml}</div>
        `;

        container.appendChild(wrapper);
      });

      if (keys.length > 1) {
        document.getElementById('btn-more').classList.remove('hidden');
      }
    }

    function mostrarMes() {
      document.querySelectorAll('.extra-block').forEach(b => b.classList.remove('hidden'));
      document.getElementById('btn-more').classList.add('hidden');
    }

    cargarPartidos();
  </script>
</body>
</html>
