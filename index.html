<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>Agenda C.E. Llinars</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    background: #0a0f1e;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 0;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 1rem; }

  /* HEADER */
  header {
    text-align: center;
    padding: 1.5rem 1rem;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    border-radius: 16px;
    margin-bottom: 1rem;
  }
  header h1 { font-size: 1.4rem; color: white; margin-bottom: 0.3rem; }
  header p { color: #bfdbfe; font-size: 0.85rem; }

  /* FILTROS */
  .filters {
    display: flex; gap: 0.5rem; margin-bottom: 1rem;
    overflow-x: auto; padding-bottom: 0.3rem;
  }
  .filter-btn {
    padding: 0.5rem 1rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: #3b82f6; border-color: #3b82f6; color: white;
  }

  /* TARJETA DE DÍA */
  .dia-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .dia-card.hoy {
    border-color: #fbbf24;
    box-shadow: 0 0 20px rgba(251,191,36,0.15);
  }

  /* CABECERA DEL DÍA */
  .dia-header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .dia-card.hoy .dia-header {
    background: linear-gradient(90deg, #92400e, #f59e0b);
  }
  .dia-numero {
    background: white;
    color: #1e3a8a;
    width: 48px; height: 48px;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .dia-card.hoy .dia-numero { color: #92400e; }
  .dia-numero .num { font-size: 1.3rem; font-weight: 800; line-height: 1; }
  .dia-numero .mes { font-size: 0.6rem; text-transform: uppercase; font-weight: 600; }
  .dia-info { flex: 1; min-width: 0; }
  .dia-semana { font-size: 0.95rem; font-weight: 700; color: white; }
  .dia-fecha { font-size: 0.75rem; color: rgba(255,255,255,0.7); }

  /* FILA DE PARTIDO */
  .partido-fila {
    display: grid;
    grid-template-columns: 60px 1fr;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 0.8rem 1rem;
    gap: 0.8rem;
    align-items: center;
  }
  .partido-fila:last-child { border-bottom: none; }

  /* Columna izquierda: hora + jugador */
  .partido-hora-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }
  .hora {
    font-size: 1rem;
    font-weight: 700;
    color: #fbbf24;
    font-variant-numeric: tabular-nums;
  }
  .jugador-tag {
    font-size: 0.6rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .jugador-tag.erik { background: #3b82f6; color: white; }
  .jugador-tag.biel { background: #8b5cf6; color: white; }

  /* Columna derecha: equipos + campo */
  .partido-info-col { display: flex; flex-direction: column; gap: 0.5rem; }

  /* Equipos en una línea */
  .equipos-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .equipo {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex: 1;
    min-width: 0;
  }
  .equipo.local { justify-content: flex-end; text-align: right; }
  .equipo.visitante { justify-content: flex-start; text-align: left; }
  .equipo-nombre {
    font-size: 0.78rem;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .escudo {
    width: 32px; height: 32px;
    object-fit: contain;
    background: white;
    border-radius: 6px;
    padding: 2px;
    flex-shrink: 0;
  }
  .escudo-fallback {
    width: 32px; height: 32px;
    background: white;
    border-radius: 6px;
    padding: 2px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .escudo-fallback svg { width: 26px; height: 26px; }
  .vs {
    font-size: 0.7rem;
    font-weight: 800;
    color: #64748b;
    flex-shrink: 0;
  }

  /* Campo (enlace) */
  .campo-link {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    color: #60a5fa;
    text-decoration: none;
    padding: 0.3rem 0.5rem;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 6px;
    border: 1px solid rgba(59, 130, 246, 0.15);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.2s;
  }
  .campo-link:active { background: rgba(59, 130, 246, 0.2); }
  .campo-link .pin { flex-shrink: 0; }
  .campo-link .campo-texto {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Badge local/visitante */
  .lv-badge {
    font-size: 0.65rem;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .lv-badge.local { background: rgba(34, 197, 94, 0.15); color: #86efac; }
  .lv-badge.visitante { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

  /* Info inferior del partido */
  .partido-footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .jornada {
    font-size: 0.7rem;
    color: #94a3b8;
    background: rgba(255,255,255,0.05);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  /* Estados */
  .loading, .empty { text-align: center; padding: 3rem; color: #64748b; font-size: 0.9rem; }
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5; padding: 1rem; border-radius: 10px;
    font-size: 0.85rem;
  }

  @media (max-width: 380px) {
    .partido-fila { grid-template-columns: 50px 1fr; padding: 0.7rem 0.8rem; }
    .escudo, .escudo-fallback { width: 28px; height: 28px; }
    .escudo-fallback svg { width: 22px; height: 22px; }
    .equipo-nombre { font-size: 0.72rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1> AGENDA C.E. LLINARS</h1>
    <p>Temporada 2026-2027</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="todos">Tots</button>
    <button class="filter-btn" data-filter="Erik">Erik</button>
    <button class="filter-btn" data-filter="Biel">Biel</button>
  </div>

  <div id="contenido">
    <div class="loading">Carregant partits...</div>
  </div>
</div>

<script>
const ESCUDO_LLINARS_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 10 L85 25 L85 75 L50 90 L15 75 L15 25 Z" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2"/><rect x="20" y="30" width="30" height="20" fill="#3b82f6"/><rect x="50" y="30" width="30" height="20" fill="#fbbf24"/><rect x="20" y="50" width="30" height="20" fill="#ef4444"/><rect x="50" y="50" width="30" height="20" fill="#1e3a8a"/><text x="50" y="65" text-anchor="middle" font-size="8" font-weight="bold" fill="white">LLINARS</text></svg>`;

const MESES = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const DIAS_SEMANA = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];

let partidosData = [];
let filtroActual = 'todos';

// Limpiar espacios en claves y valores
function limpiar(obj) {
  if (Array.isArray(obj)) return obj.map(limpiar);
  if (typeof obj === 'object' && obj !== null) {
    const limpio = {};
    for (const [clave, valor] of Object.entries(obj)) {
      const k = clave.trim();
      limpio[k] = typeof valor === 'string' ? valor.trim() : limpiar(valor);
    }
    return limpio;
  }
  return obj;
}

async function cargarPartidos() {
  try {
    const res = await fetch('partidos.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    partidosData = limpiar(data);
    renderizar();
  } catch (err) {
    document.getElementById('contenido').innerHTML =
      `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
  }
}

function agruparPorFecha(partidos) {
  const grupos = {};
  partidos.forEach(p => {
    const f = p.fecha || '';
    if (!grupos[f]) grupos[f] = [];
    grupos[f].push(p);
  });
  return Object.keys(grupos)
    .sort((a, b) => new Date(a) - new Date(b))
    .map(fecha => ({ fecha, partidos: grupos[fecha] }));
}

function googleMapsUrl(campo) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(campo + ' Llinars del Vallès')}`;
}

function renderizar() {
  const contenido = document.getElementById('contenido');
  let filtrados = partidosData;
  if (filtroActual !== 'todos') {
    filtrados = filtrados.filter(p => p.jugador === filtroActual);
  }
  if (filtrados.length === 0) {
    contenido.innerHTML = '<div class="empty">No hi ha partits per mostrar</div>';
    return;
  }

  const dias = agruparPorFecha(filtrados);
  const hoy = new Date().toDateString();

  const html = dias.map(dia => {
    const fecha = new Date(dia.fecha + 'T12:00:00');
    const diaSemana = DIAS_SEMANA[fecha.getDay()];
    const numDia = fecha.getDate();
    const mes = MESES[fecha.getMonth()];
    const año = fecha.getFullYear();
    const esHoy = fecha.toDateString() === hoy;

    const partidosHtml = dia.partidos.map(p => {
      const tag = p.jugador === 'Biel' ? 'biel' : 'erik';
      const lvClass = p.es_local ? 'local' : 'visitante';
      const lvText = p.es_local ? 'Local' : 'Visitant';
      const mapaUrl = googleMapsUrl(p.campo);

      return `
        <div class="partido-fila">
          <div class="partido-hora-col">
            <div class="hora">${p.hora}</div>
            <div class="jugador-tag ${tag}">${p.jugador}</div>
          </div>
          <div class="partido-info-col">
            <div class="equipos-row">
              <div class="equipo local">
                <span class="equipo-nombre">${p.equipo_local}</span>
                <img src="${p.escudo_local}" alt="" class="escudo"
                     onerror="this.outerHTML='<div class=\\'escudo-fallback\\'>${ESCUDO_LLINARS_SVG}</div>'">
              </div>
              <div class="vs">VS</div>
              <div class="equipo visitante">
                <img src="${p.escudo_visitante}" alt="" class="escudo"
                     onerror="this.outerHTML='<div class=\\'escudo-fallback\\'>${ESCUDO_LLINARS_SVG}</div>'">
                <span class="equipo-nombre">${p.equipo_visitante}</span>
              </div>
            </div>
            <div class="partido-footer">
              <a href="${mapaUrl}" target="_blank" rel="noopener" class="campo-link">
                <span class="pin"></span>
                <span class="campo-texto">${p.campo}</span>
              </a>
              <span class="lv-badge ${lvClass}">${lvText}</span>
              <span class="jornada">J${p.jornada}</span>
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="dia-card ${esHoy ? 'hoy' : ''}">
        <div class="dia-header">
          <div class="dia-numero">
            <span class="num">${numDia}</span>
            <span class="mes">${mes.substring(0,3)}</span>
          </div>
          <div class="dia-info">
            <div class="dia-semana">${diaSemana}${esHoy ? ' · AVUI' : ''}</div>
            <div class="dia-fecha">${numDia} ${mes} ${año} · ${dia.partidos.length} partit${dia.partidos.length > 1 ? 's' : ''}</div>
          </div>
        </div>
        ${partidosHtml}
      </div>`;
  }).join('');

  contenido.innerHTML = html;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.filter;
    renderizar();
  });
});

cargarPartidos();
</script>
</body>
</html>
