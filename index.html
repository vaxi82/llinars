<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Agenda C.E. Llinars</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0b1120;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 0;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 1rem; }

  header {
    text-align: center;
    padding: 1.5rem 1rem 1.2rem;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    border-radius: 18px;
    margin-bottom: 1rem;
    box-shadow: 0 10px 30px rgba(59, 130, 246, 0.25);
  }
  header h1 {
    font-size: 1.3rem;
    font-weight: 800;
    color: white;
    letter-spacing: -0.02em;
    margin-bottom: 0.2rem;
  }
  header p { color: #bfdbfe; font-size: 0.8rem; font-weight: 500; }

  .filters {
    display: flex; gap: 0.5rem; margin-bottom: 1rem;
    overflow-x: auto; padding-bottom: 0.2rem;
  }
  .filter-btn {
    padding: 0.5rem 1rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: #3b82f6; border-color: #3b82f6; color: white;
  }

  .dia-card {
    background: #111827;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .dia-card.hoy {
    border-color: #fbbf24;
    box-shadow: 0 0 0 1px #fbbf24, 0 10px 30px rgba(251,191,36,0.15);
  }

  .dia-header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .dia-card.hoy .dia-header {
    background: linear-gradient(90deg, #92400e, #d97706);
  }
  .dia-numero {
    background: white;
    color: #1e3a8a;
    width: 50px; height: 50px;
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .dia-card.hoy .dia-numero { color: #92400e; }
  .dia-numero .num { font-size: 1.4rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  .dia-numero .mes { font-size: 0.6rem; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
  .dia-info { flex: 1; min-width: 0; }
  .dia-semana { font-size: 1rem; font-weight: 700; color: white; }
  .dia-fecha { font-size: 0.75rem; color: rgba(255,255,255,0.75); font-weight: 500; }

  .partido {
    padding: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .partido:last-child { border-bottom: none; }

  .partido-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.8rem;
  }
  .jugador-info {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .jugador-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .jugador-dot.erik { background: #3b82f6; }
  .jugador-dot.biel { background: #8b5cf6; }
  .jugador-nombre {
    font-size: 0.85rem;
    font-weight: 700;
    color: white;
    letter-spacing: -0.01em;
  }
  .jugador-cat {
    font-size: 0.7rem;
    color: #94a3b8;
    font-weight: 500;
  }
  .hora-badge {
    background: rgba(251, 191, 36, 0.12);
    color: #fbbf24;
    padding: 0.3rem 0.7rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    border: 1px solid rgba(251, 191, 36, 0.2);
  }

  .equipos {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.8rem;
  }
  .equipo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    min-width: 0;
  }
  .escudo-wrap {
    width: 56px; height: 56px;
    background: white;
    border-radius: 12px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .escudo {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .escudo-placeholder {
    width: 100%; height: 100%;
    background: #f1f5f9;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .escudo-placeholder svg {
    width: 24px; height: 24px;
    color: #94a3b8;
  }
  .equipo-nombre {
    font-size: 0.72rem;
    color: #cbd5e1;
    text-align: center;
    font-weight: 600;
    line-height: 1.2;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    min-height: 1.8em;
    padding: 0 0.2rem;
  }
  .vs {
    font-size: 0.8rem;
    font-weight: 900;
    color: #475569;
    letter-spacing: 0.05em;
  }

  .partido-bottom {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding-top: 0.7rem;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .campo-link {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.72rem;
    color: #60a5fa;
    text-decoration: none;
    padding: 0.3rem 0.6rem;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 6px;
    border: 1px solid rgba(59, 130, 246, 0.15);
    flex: 1;
    min-width: 0;
    font-weight: 500;
  }
  .campo-link:active { background: rgba(59, 130, 246, 0.18); }
  .campo-texto {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lv-badge {
    font-size: 0.68rem;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .lv-badge.local { background: rgba(34, 197, 94, 0.15); color: #86efac; }
  .lv-badge.visitante { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
  .jornada {
    font-size: 0.68rem;
    color: #94a3b8;
    background: rgba(255,255,255,0.05);
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .loading, .empty { text-align: center; padding: 3rem; color: #64748b; font-size: 0.9rem; }
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5; padding: 1rem; border-radius: 12px;
    font-size: 0.85rem;
  }

  @media (max-width: 380px) {
    .escudo-wrap { width: 48px; height: 48px; }
    .equipo-nombre { font-size: 0.68rem; }
    .partido { padding: 0.8rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1> AGENDA C.E. LLINARS</h1>
    <p>Temporada 2026-2027</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="todos">Tots</button>
    <button class="filter-btn" data-filter="Erik">Erik</button>
    <button class="filter-btn" data-filter="Biel">Biel</button>
  </div>

  <div id="contenido">
    <div class="loading">Carregant partits...</div>
  </div>
</div>

<script>
const PLACEHOLDER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`;

const MESES = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const DIAS_SEMANA = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];

let partidosData = [];
let filtroActual = 'todos';

function limpiar(obj) {
  if (Array.isArray(obj)) return obj.map(limpiar);
  if (typeof obj === 'object' && obj !== null) {
    const limpio = {};
    for (const [clave, valor] of Object.entries(obj)) {
      const k = clave.trim();
      limpio[k] = typeof valor === 'string' ? valor.trim() : limpiar(valor);
    }
    return limpio;
  }
  return obj;
}

function aRutaLocal(url) {
  if (!url) return null;
  url = url.trim();
  if (url.includes('fcf.cat/img/escudos/')) {
    const nombre = url.split('/').pop();
    return `escudos/${nombre.replace(/\s+/g, '_')}`;
  }
  return url;
}

// ✅ Cambio: ahora SIEMPRE muestra el nombre, incluido Llinars
function renderizarEquipo(nombre, escudoUrl) {
  return `
    <div class="equipo">
      <div class="escudo-wrap">
        <img src="${escudoUrl}" alt="${nombre}" class="escudo" onerror="window.fallbackEscudo(this)">
      </div>
      <div class="equipo-nombre">${nombre}</div>
    </div>`;
}

window.fallbackEscudo = function(img) {
  const div = document.createElement('div');
  div.className = 'escudo-placeholder';
  div.innerHTML = PLACEHOLDER_SVG;
  img.parentNode.replaceChild(div, img);
};

async function cargarPartidos() {
  try {
    const res = await fetch('partidos.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    partidosData = limpiar(data);
    partidosData.forEach(p => {
      p.escudo_local = aRutaLocal(p.escudo_local);
      p.escudo_visitante = aRutaLocal(p.escudo_visitante);
    });
    renderizar();
  } catch (err) {
    document.getElementById('contenido').innerHTML =
      `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
  }
}

function agruparPorFecha(partidos) {
  const grupos = {};
  partidos.forEach(p => {
    const f = p.fecha || '';
    if (!grupos[f]) grupos[f] = [];
    grupos[f].push(p);
  });
  return Object.keys(grupos)
    .sort((a, b) => new Date(a) - new Date(b))
    .map(fecha => ({ fecha, partidos: grupos[fecha] }));
}

function googleMapsUrl(campo) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(campo + ' Llinars del Vallès')}`;
}

function renderizar() {
  const contenido = document.getElementById('contenido');
  let filtrados = partidosData;
  if (filtroActual !== 'todos') {
    filtrados = filtrados.filter(p => p.jugador === filtroActual);
  }
  if (filtrados.length === 0) {
    contenido.innerHTML = '<div class="empty">No hi ha partits per mostrar</div>';
    return;
  }

  const dias = agruparPorFecha(filtrados);
  const hoy = new Date().toDateString();

  const html = dias.map(dia => {
    const fecha = new Date(dia.fecha + 'T12:00:00');
    const diaSemana = DIAS_SEMANA[fecha.getDay()];
    const numDia = fecha.getDate();
    const mes = MESES[fecha.getMonth()];
    const año = fecha.getFullYear();
    const esHoy = fecha.toDateString() === hoy;

    const partidosHtml = dia.partidos.map(p => {
      const tag = p.jugador === 'Biel' ? 'biel' : 'erik';
      const lvClass = p.es_local ? 'local' : 'visitante';
      const lvText = p.es_local ? 'Local' : 'Visitant';
      const mapaUrl = googleMapsUrl(p.campo);

      return `
        <div class="partido">
          <div class="partido-top">
            <div class="jugador-info">
              <span class="jugador-dot ${tag}"></span>
              <div>
                <div class="jugador-nombre">${p.jugador}</div>
                <div class="jugador-cat">${p.categoria}</div>
              </div>
            </div>
            <div class="hora-badge">🕐 ${p.hora}</div>
          </div>

          <div class="equipos">
            ${renderizarEquipo(p.equipo_local, p.escudo_local)}
            <div class="vs">VS</div>
            ${renderizarEquipo(p.equipo_visitante, p.escudo_visitante)}
          </div>

          <div class="partido-bottom">
            <a href="${mapaUrl}" target="_blank" rel="noopener" class="campo-link">
               <span class="campo-texto">${p.campo}</span>
            </a>
            <span class="lv-badge ${lvClass}">${lvText}</span>
            <span class="jornada">J${p.jornada}</span>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="dia-card ${esHoy ? 'hoy' : ''}">
        <div class="dia-header">
          <div class="dia-numero">
            <span class="num">${numDia}</span>
            <span class="mes">${mes.substring(0,3)}</span>
          </div>
          <div class="dia-info">
            <div class="dia-semana">${diaSemana}${esHoy ? ' · AVUI' : ''}</div>
            <div class="dia-fecha">${numDia} ${mes} ${año} · ${dia.partidos.length} partit${dia.partidos.length > 1 ? 's' : ''}</div>
          </div>
        </div>
        ${partidosHtml}
      </div>`;
  }).join('');

  contenido.innerHTML = html;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.filter;
    renderizar();
  });
});

cargarPartidos();
</script>
</body>
</html>
