<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>Agenda C.E. Llinars</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    background: #0a0f1e;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 0;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 1rem; }

  header {
    text-align: center;
    padding: 1.5rem 1rem;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    border-radius: 16px;
    margin-bottom: 1rem;
  }
  header h1 { font-size: 1.4rem; color: white; margin-bottom: 0.3rem; }
  header p { color: #bfdbfe; font-size: 0.85rem; }

  .filters {
    display: flex; gap: 0.5rem; margin-bottom: 1rem;
    overflow-x: auto; padding-bottom: 0.3rem;
  }
  .filter-btn {
    padding: 0.5rem 1rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: #3b82f6; border-color: #3b82f6; color: white;
  }

  .dia-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .dia-card.hoy {
    border-color: #fbbf24;
    box-shadow: 0 0 20px rgba(251,191,36,0.15);
  }

  .dia-header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .dia-card.hoy .dia-header {
    background: linear-gradient(90deg, #92400e, #f59e0b);
  }
  .dia-numero {
    background: white;
    color: #1e3a8a;
    width: 48px; height: 48px;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .dia-card.hoy .dia-numero { color: #92400e; }
  .dia-numero .num { font-size: 1.3rem; font-weight: 800; line-height: 1; }
  .dia-numero .mes { font-size: 0.6rem; text-transform: uppercase; font-weight: 600; }
  .dia-info { flex: 1; min-width: 0; }
  .dia-semana { font-size: 0.95rem; font-weight: 700; color: white; }
  .dia-fecha { font-size: 0.75rem; color: rgba(255,255,255,0.7); }

  .partido-fila {
    display: grid;
    grid-template-columns: 60px 1fr;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 0.8rem 1rem;
    gap: 0.8rem;
    align-items: center;
  }
  .partido-fila:last-child { border-bottom: none; }

  .partido-hora-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }
  .hora {
    font-size: 1rem;
    font-weight: 700;
    color: #fbbf24;
    font-variant-numeric: tabular-nums;
  }
  .jugador-tag {
    font-size: 0.6rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .jugador-tag.erik { background: #3b82f6; color: white; }
  .jugador-tag.biel { background: #8b5cf6; color: white; }

  .partido-info-col { display: flex; flex-direction: column; gap: 0.5rem; }

  .equipos-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.5rem;
    align-items: start;
  }
  .equipo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }
  .escudo {
    width: 48px; height: 48px;
    object-fit: contain;
    background: white;
    border-radius: 8px;
    padding: 3px;
  }
  .escudo-placeholder {
    width: 48px; height: 48px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .escudo-placeholder svg {
    width: 24px; height: 24px;
    color: rgba(255,255,255,0.3);
  }
  .equipo-nombre {
    font-size: 0.7rem;
    color: #cbd5e1;
    text-align: center;
    line-height: 1.2;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    min-height: 1.6em;
  }
  .equipo-nombre.oculto {
    visibility: hidden;
    min-height: 0;
    height: 0;
    margin: 0;
  }
  .vs {
    font-size: 0.75rem;
    font-weight: 800;
    color: #64748b;
    align-self: center;
    padding-top: 1.2rem;
  }

  .campo-link {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    color: #60a5fa;
    text-decoration: none;
    padding: 0.3rem 0.5rem;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 6px;
    border: 1px solid rgba(59, 130, 246, 0.15);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .campo-link:active { background: rgba(59, 130, 246, 0.2); }

  .lv-badge {
    font-size: 0.65rem;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-weight: 600;
  }
  .lv-badge.local { background: rgba(34, 197, 94, 0.15); color: #86efac; }
  .lv-badge.visitante { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

  .partido-footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .jornada {
    font-size: 0.7rem;
    color: #94a3b8;
    background: rgba(255,255,255,0.05);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  .loading, .empty { text-align: center; padding: 3rem; color: #64748b; font-size: 0.9rem; }
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5; padding: 1rem; border-radius: 10px;
    font-size: 0.85rem;
  }

  @media (max-width: 380px) {
    .partido-fila { grid-template-columns: 50px 1fr; padding: 0.7rem 0.8rem; }
    .escudo, .escudo-placeholder { width: 42px; height: 42px; }
    .equipo-nombre { font-size: 0.65rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚽ AGENDA C.E. LLINARS</h1>
    <p>Temporada 2026-2027</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="todos">Tots</button>
    <button class="filter-btn" data-filter="Erik">Erik</button>
    <button class="filter-btn" data-filter="Biel">Biel</button>
  </div>

  <div id="contenido">
    <div class="loading">Carregant partits...</div>
  </div>
</div>

<script>
const PLACEHOLDER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`;

const MESES = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const DIAS_SEMANA = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];

let partidosData = [];
let filtroActual = 'todos';

// Limpiar espacios en claves y valores
function limpiar(obj) {
  if (Array.isArray(obj)) return obj.map(limpiar);
  if (typeof obj === 'object' && obj !== null) {
    const limpio = {};
    for (const [clave, valor] of Object.entries(obj)) {
      const k = clave.trim();
      limpio[k] = typeof valor === 'string' ? valor.trim() : limpiar(valor);
    }
    return limpio;
  }
  return obj;
}

// Convertir URL de fcf.cat a ruta local
function aRutaLocal(url) {
  if (!url) return null;
  url = url.trim();
  if (url.includes('fcf.cat/img/escudos/')) {
    const nombre = url.split('/').pop();
    const nombreSeguro = nombre.replace(/\s+/g, '_');
    return `escudos/${nombreSeguro}`;
  }
  return url;
}

function esLlinars(nombre) {
  return nombre && nombre.toUpperCase().includes('LLINARS');
}

async function cargarPartidos() {
  try {
    const res = await fetch('partidos.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    partidosData = limpiar(data);
    // Convertir URLs de escudos a rutas locales
    partidosData.forEach(p => {
      p.escudo_local = aRutaLocal(p.escudo_local);
      p.escudo_visitante = aRutaLocal(p.escudo_visitante);
    });
    renderizar();
  } catch (err) {
    document.getElementById('contenido').innerHTML =
      `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
  }
}

function agruparPorFecha(partidos) {
  const grupos = {};
  partidos.forEach(p => {
    const f = p.fecha || '';
    if (!grupos[f]) grupos[f] = [];
    grupos[f].push(p);
  });
  return Object.keys(grupos)
    .sort((a, b) => new Date(a) - new Date(b))
    .map(fecha => ({ fecha, partidos: grupos[fecha] }));
}

function googleMapsUrl(campo) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(campo + ' Llinars del Vallès')}`;
}

function renderizarEquipo(nombre, escudoUrl, esLocal) {
  const esLli = esLlinars(nombre);
  const nombreOculto = esLli ? 'oculto' : '';
  const nombreTexto = esLli ? '' : nombre;

  return `
    <div class="equipo">
      <img src="${escudoUrl}" alt="${nombre}" class="escudo"
           onerror="this.outerHTML='<div class=\\'escudo-placeholder\\'>${PLACEHOLDER_SVG}</div>'">
      <div class="equipo-nombre ${nombreOculto}">${nombreTexto}</div>
    </div>`;
}

function renderizar() {
  const contenido = document.getElementById('contenido');
  let filtrados = partidosData;
  if (filtroActual !== 'todos') {
    filtrados = filtrados.filter(p => p.jugador === filtroActual);
  }
  if (filtrados.length === 0) {
    contenido.innerHTML = '<div class="empty">No hi ha partits per mostrar</div>';
    return;
  }

  const dias = agruparPorFecha(filtrados);
  const hoy = new Date().toDateString();

  const html = dias.map(dia => {
    const fecha = new Date(dia.fecha + 'T12:00:00');
    const diaSemana = DIAS_SEMANA[fecha.getDay()];
    const numDia = fecha.getDate();
    const mes = MESES[fecha.getMonth()];
    const año = fecha.getFullYear();
    const esHoy = fecha.toDateString() === hoy;

    const partidosHtml = dia.partidos.map(p => {
      const tag = p.jugador === 'Biel' ? 'biel' : 'erik';
      const lvClass = p.es_local ? 'local' : 'visitante';
      const lvText = p.es_local ? 'Local' : 'Visitant';
      const mapaUrl = googleMapsUrl(p.campo);

      return `
        <div class="partido-fila">
          <div class="partido-hora-col">
            <div class="hora">${p.hora}</div>
            <div class="jugador-tag ${tag}">${p.jugador}</div>
          </div>
          <div class="partido-info-col">
            <div class="equipos-row">
              ${renderizarEquipo(p.equipo_local, p.escudo_local, true)}
              <div class="vs">VS</div>
              ${renderizarEquipo(p.equipo_visitante, p.escudo_visitante, false)}
            </div>
            <div class="partido-footer">
              <a href="${mapaUrl}" target="_blank" rel="noopener" class="campo-link">
                📍 <span>${p.campo}</span>
              </a>
              <span class="lv-badge ${lvClass}">${lvText}</span>
              <span class="jornada">J${p.jornada}</span>
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="dia-card ${esHoy ? 'hoy' : ''}">
        <div class="dia-header">
          <div class="dia-numero">
            <span class="num">${numDia}</span>
            <span class="mes">${mes.substring(0,3)}</span>
          </div>
          <div class="dia-info">
            <div class="dia-semana">${diaSemana}${esHoy ? ' · AVUI' : ''}</div>
            <div class="dia-fecha">${numDia} ${mes} ${año} · ${dia.partidos.length} partit${dia.partidos.length > 1 ? 's' : ''}</div>
          </div>
        </div>
        ${partidosHtml}
      </div>`;
  }).join('');

  contenido.innerHTML = html;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.filter;
    renderizar();
  });
});

cargarPartidos();
</script>
</body>
</html>
