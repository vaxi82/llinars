<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Agenda C.E. Llinars</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0b1120;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 1rem; }

  header {
    text-align: center;
    padding: 1.5rem 1rem 1.2rem;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    border-radius: 18px;
    margin-bottom: 1rem;
    box-shadow: 0 10px 30px rgba(59, 130, 246, 0.25);
  }
  header h1 { font-size: 1.3rem; font-weight: 800; color: white; letter-spacing: -0.02em; margin-bottom: 0.2rem; }
  header p { color: #bfdbfe; font-size: 0.8rem; font-weight: 500; }

  .filters {
    display: flex; gap: 0.5rem; margin-bottom: 1rem;
    overflow-x: auto; padding-bottom: 0.2rem;
  }
  .filter-btn {
    padding: 0.5rem 1rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.2s;
  }
  .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }

  .semanas-container {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    gap: 1rem;
    padding: 0.5rem 0.5rem 1rem;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .semanas-container::-webkit-scrollbar { display: none; }

  .semana-card {
    flex: 0 0 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .semana-header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    padding: 0.9rem 1rem;
    border-radius: 14px;
    text-align: center;
  }
  .semana-card.actual .semana-header {
    background: linear-gradient(90deg, #92400e, #d97706);
  }
  .semana-titulo { font-size: 1rem; font-weight: 800; color: white; margin-bottom: 0.2rem; }
  .semana-rango { font-size: 0.78rem; color: rgba(255,255,255,0.85); font-weight: 500; }
  .badge-actual {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    margin-top: 0.4rem;
    color: white;
  }

  .dia-card {
    background: #111827;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    overflow: hidden;
  }
  .dia-card.hoy {
    border-color: #fbbf24;
    box-shadow: 0 0 0 1px rgba(251,191,36,0.3);
  }

  .dia-header {
    background: rgba(255,255,255,0.04);
    padding: 0.7rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.7rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .dia-header-izq {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    flex: 1;
    min-width: 0;
  }
  .dia-header-der { flex-shrink: 0; }
  .dia-numero {
    background: white;
    color: #1e3a8a;
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .dia-card.hoy .dia-numero { background: #fbbf24; color: #78350f; }
  .dia-numero .num { font-size: 1.2rem; font-weight: 900; line-height: 1; }
  .dia-numero .mes { font-size: 0.55rem; text-transform: uppercase; font-weight: 700; }
  .dia-info { flex: 1; min-width: 0; }
  .dia-semana { font-size: 0.9rem; font-weight: 700; color: white; }
  .dia-sub { font-size: 0.72rem; color: #94a3b8; font-weight: 500; margin-top: 2px; }

  .turno-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .turno-badge.manana {
    background: rgba(34, 197, 94, 0.18);
    color: #86efac;
    border: 1px solid rgba(34, 197, 94, 0.35);
  }
  .turno-badge.tarde {
    background: rgba(239, 68, 68, 0.18);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.35);
  }
  .turno-badge.refuerzo {
    background: rgba(59, 130, 246, 0.18);
    color: #93c5fd;
    border: 1px solid rgba(59, 130, 246, 0.35);
  }
  .turno-badge.fiesta {
    background: rgba(148, 163, 184, 0.12);
    color: #94a3b8;
    border: 1px solid rgba(148, 163, 184, 0.25);
  }
  .turno-icon { font-size: 0.95rem; }

  .partido {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .partido:last-child { border-bottom: none; }

  .partido-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.7rem;
  }
  .jugador-info { display: flex; align-items: center; gap: 0.5rem; }
  .jugador-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .jugador-dot.erik { background: #3b82f6; }
  .jugador-dot.biel { background: #8b5cf6; }
  .jugador-nombre { font-size: 0.82rem; font-weight: 700; color: white; }
  .jugador-cat { font-size: 0.68rem; color: #94a3b8; font-weight: 500; }
  .hora-badge {
    background: rgba(251, 191, 36, 0.12);
    color: #fbbf24;
    padding: 0.25rem 0.6rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    border: 1px solid rgba(251, 191, 36, 0.2);
  }

  .equipos {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.7rem;
  }
  .equipo { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; min-width: 0; }
  .escudo-wrap {
    width: 52px; height: 52px;
    background: white;
    border-radius: 11px;
    padding: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .escudo { width: 100%; height: 100%; object-fit: contain; }
  .escudo-placeholder {
    width: 100%; height: 100%;
    background: #f1f5f9;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .escudo-placeholder svg { width: 22px; height: 22px; color: #94a3b8; }
  .equipo-nombre {
    font-size: 0.7rem;
    color: #cbd5e1;
    text-align: center;
    font-weight: 600;
    line-height: 1.2;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    min-height: 1.7em;
    padding: 0 0.2rem;
  }
  .vs { font-size: 0.75rem; font-weight: 900; color: #475569; }

  .partido-bottom {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding-top: 0.6rem;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .campo-link {
    display: flex; align-items: center; gap: 0.3rem;
    font-size: 0.7rem; color: #60a5fa;
    text-decoration: none; padding: 0.25rem 0.5rem;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 6px; border: 1px solid rgba(59, 130, 246, 0.15);
    flex: 1; min-width: 0; font-weight: 500;
  }
  .campo-link:active { background: rgba(59, 130, 246, 0.18); }
  .campo-texto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-badge { font-size: 0.65rem; padding: 0.2rem 0.45rem; border-radius: 6px; font-weight: 700; flex-shrink: 0; }
  .lv-badge.local { background: rgba(34, 197, 94, 0.15); color: #86efac; }
  .lv-badge.visitante { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
  .jornada {
    font-size: 0.65rem; color: #94a3b8;
    background: rgba(255,255,255,0.05);
    padding: 0.2rem 0.45rem; border-radius: 6px; font-weight: 600; flex-shrink: 0;
  }

  .loading, .empty { text-align: center; padding: 3rem; color: #64748b; font-size: 0.9rem; }
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5; padding: 1rem; border-radius: 12px; font-size: 0.85rem;
  }

  .scroll-indicator {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.5rem;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s;
  }
  .dot.active {
    background: #3b82f6;
    width: 24px;
    border-radius: 4px;
  }

  @media (max-width: 380px) {
    .escudo-wrap { width: 46px; height: 46px; }
    .equipo-nombre { font-size: 0.66rem; }
    .partido { padding: 0.75rem; }
    .turno-badge { font-size: 0.75rem; padding: 0.35rem 0.6rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1> AGENDA C.E. LLINARS</h1>
    <p>Temporada 2026-2027</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="todos">Tots</button>
    <button class="filter-btn" data-filter="Erik">Erik</button>
    <button class="filter-btn" data-filter="Biel">Biel</button>
  </div>

  <div id="contenido">
    <div class="loading">Carregant partits...</div>
  </div>

  <div class="scroll-indicator" id="scrollIndicator"></div>
</div>

<script>
const PLACEHOLDER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`;
const MESES = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const MESES_CORTOS = ['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
const DIAS_SEMANA = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];

// ============================================================
// CÁLCULO DE TURNOS - CICLO DE 42 DÍAS
// Inicio: 29 diciembre 2025
// FIESTA(7) → MAÑANA(7) → FIESTA(7) → TARDE(7) → FIESTA(7) → REFUERZO(7)
// ============================================================
const INICIO_CICLO = new Date('2025-12-29T00:00:00');
const DURACION_CICLO = 42;

function calcularTurno(fechaStr) {
  const fecha = new Date(fechaStr + 'T00:00:00');
  const diffMs = fecha - INICIO_CICLO;
  const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDias < 0) return 'fiesta';
  const pos = diffDias % DURACION_CICLO;
  if (pos < 7) return 'fiesta';
  if (pos < 14) return 'manana';
  if (pos < 21) return 'fiesta';
  if (pos < 28) return 'tarde';
  if (pos < 35) return 'fiesta';
  return 'refuerzo';
}

const INFO_TURNOS = {
  manana:  { icon: '🌅', texto: 'Matí' },
  tarde:   { icon: '🌆', texto: 'Tarda' },
  refuerzo:{ icon: '💪', texto: 'Reforç' },
  fiesta:  { icon: '🏖️', texto: 'Festa' }
};

let partidosData = [];
let filtroActual = 'todos';

function limpiar(obj) {
  if (Array.isArray(obj)) return obj.map(limpiar);
  if (typeof obj === 'object' && obj !== null) {
    const limpio = {};
    for (const [clave, valor] of Object.entries(obj)) {
      const k = clave.trim();
      limpio[k] = typeof valor === 'string' ? valor.trim() : limpiar(valor);
    }
    return limpio;
  }
  return obj;
}

function aRutaLocal(url) {
  if (!url) return null;
  url = url.trim();
  if (url.includes('fcf.cat/img/escudos/')) {
    const nombre = url.split('/').pop();
    return `escudos/${nombre.replace(/\s+/g, '_')}`;
  }
  return url;
}

function renderizarEquipo(nombre, escudoUrl) {
  return `
    <div class="equipo">
      <div class="escudo-wrap">
        <img src="${escudoUrl}" alt="${nombre}" class="escudo" onerror="window.fallbackEscudo(this)">
      </div>
      <div class="equipo-nombre">${nombre}</div>
    </div>`;
}

window.fallbackEscudo = function(img) {
  if (img.classList.contains('fallback-applied')) return;
  img.classList.add('fallback-applied');
  const div = document.createElement('div');
  div.className = 'escudo-placeholder';
  div.innerHTML = PLACEHOLDER_SVG;
  img.parentNode.replaceChild(div, img);
};

async function cargarPartidos() {
  try {
    const res = await fetch('partidos.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    partidosData = limpiar(data);
    partidosData.forEach(p => {
      p.escudo_local = aRutaLocal(p.escudo_local);
      p.escudo_visitante = aRutaLocal(p.escudo_visitante);
    });
    renderizar();
  } catch (err) {
    document.getElementById('contenido').innerHTML =
      `<div class="error"><strong>Error:</strong> ${err.message}<br><small>Verifica que partidos.json y la carpeta escudos/ existen.</small></div>`;
  }
}

function getLunes(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay();
  const diff = (dia === 0 ? -6 : 1) - dia;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function agruparPorSemana(partidos) {
  const semanas = {};
  partidos.forEach(p => {
    const fecha = new Date(p.fecha + 'T12:00:00');
    const lunes = getLunes(fecha);
    const key = lunes.toISOString().split('T')[0];
    if (!semanas[key]) semanas[key] = { lunes, dias: {} };
    const fechaKey = fecha.toISOString().split('T')[0];
    if (!semanas[key].dias[fechaKey]) semanas[key].dias[fechaKey] = [];
    semanas[key].dias[fechaKey].push(p);
  });
  return Object.values(semanas).sort((a, b) => a.lunes - b.lunes);
}

function googleMapsUrl(campo) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(campo + ' Llinars del Vallès')}`;
}

function renderizarTurno(fechaStr) {
  const turno = calcularTurno(fechaStr);
  const info = INFO_TURNOS[turno];
  return `<div class="turno-badge ${turno}"><span class="turno-icon">${info.icon}</span><span>${info.texto}</span></div>`;
}

function renderizar() {
  const contenido = document.getElementById('contenido');
  let filtrados = partidosData;
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  filtrados = filtrados.filter(p => {
    const fechaPartido = new Date(p.fecha + 'T12:00:00');
    return fechaPartido >= hoy;
  });
  if (filtroActual !== 'todos') {
    filtrados = filtrados.filter(p => p.jugador === filtroActual);
  }
  if (filtrados.length === 0) {
    contenido.innerHTML = '<div class="empty">No hi ha partits futurs per mostrar</div>';
    document.getElementById('scrollIndicator').innerHTML = '';
    return;
  }
  const semanas = agruparPorSemana(filtrados);
  const hoyStr = hoy.toISOString().split('T')[0];
  const html = semanas.map((semana, idxSemana) => {
    const lunes = semana.lunes;
    const domingo = new Date(lunes);
    domingo.setDate(lunes.getDate() + 6);
    const esActual = hoy >= lunes && hoy <= domingo;
    const rangoStr = `${lunes.getDate()} ${MESES_CORTOS[lunes.getMonth()]} - ${domingo.getDate()} ${MESES_CORTOS[domingo.getMonth()]} ${domingo.getFullYear()}`;
    const diasOrdenados = Object.keys(semana.dias).sort((a, b) => new Date(a) - new Date(b));
    const diasHtml = diasOrdenados.map(fechaKey => {
      const fecha = new Date(fechaKey + 'T12:00:00');
      const esHoy = fechaKey === hoyStr;
      const diaSemana = DIAS_SEMANA[fecha.getDay()];
      const partidosDia = semana.dias[fechaKey].sort((a, b) => (a.hora || '00:00').localeCompare(b.hora || '00:00'));
      const partidosHtml = partidosDia.map(p => {
        const tag = p.jugador === 'Biel' ? 'biel' : 'erik';
        const lvClass = p.es_local ? 'local' : 'visitante';
        const lvText = p.es_local ? 'Local' : 'Visitant';
        const mapaUrl = googleMapsUrl(p.campo);
        return `
          <div class="partido">
            <div class="partido-top">
              <div class="jugador-info">
                <span class="jugador-dot ${tag}"></span>
                <div>
                  <div class="jugador-nombre">${p.jugador}</div>
                  <div class="jugador-cat">${p.categoria}</div>
                </div>
              </div>
              <div class="hora-badge">🕐 ${p.hora}</div>
            </div>
            <div class="equipos">
              ${renderizarEquipo(p.equipo_local, p.escudo_local)}
              <div class="vs">VS</div>
              ${renderizarEquipo(p.equipo_visitante, p.escudo_visitante)}
            </div>
            <div class="partido-bottom">
              <a href="${mapaUrl}" target="_blank" rel="noopener" class="campo-link">
                 📍 <span class="campo-texto">${p.campo}</span>
              </a>
              <span class="lv-badge ${lvClass}">${lvText}</span>
              <span class="jornada">J${p.jornada}</span>
            </div>
          </div>`;
      }).join('');
      return `
        <div class="dia-card ${esHoy ? 'hoy' : ''}">
          <div class="dia-header">
            <div class="dia-header-izq">
              <div class="dia-numero">
                <span class="num">${fecha.getDate()}</span>
                <span class="mes">${MESES_CORTOS[fecha.getMonth()]}</span>
              </div>
              <div class="dia-info">
                <div class="dia-semana">${diaSemana}${esHoy ? ' · AVUI' : ''}</div>
                <div class="dia-sub">${partidosDia.length} partit${partidosDia.length > 1 ? 's' : ''}</div>
              </div>
            </div>
            <div class="dia-header-der">
              ${renderizarTurno(fechaKey)}
            </div>
          </div>
          ${partidosHtml}
        </div>`;
    }).join('');
    return `
      <div class="semana-card ${esActual ? 'actual' : ''}" data-index="${idxSemana}">
        <div class="semana-header">
          <div class="semana-titulo">${esActual ? '🔥 AQUESTA SETMANA' : 'SETMANA'}</div>
          <div class="semana-rango">${rangoStr}</div>
          ${esActual ? '<div class="badge-actual">ACTUAL</div>' : ''}
        </div>
        ${diasHtml}
      </div>`;
  }).join('');
  contenido.innerHTML = `<div class="semanas-container" id="semanasContainer">${html}</div>`;
  const container = document.getElementById('semanasContainer');
  const semanaActual = document.querySelector('.semana-card.actual');
  if (semanaActual) {
    const idx = parseInt(semanaActual.dataset.index);
    setTimeout(() => {
      container.scrollTo({ left: idx * container.offsetWidth, behavior: 'instant' });
      actualizarIndicadores(idx, semanas.length);
    }, 50);
  } else {
    actualizarIndicadores(0, semanas.length);
  }
  let currentIndex = 0;
  container.addEventListener('scroll', () => {
    const newIndex = Math.round(container.scrollLeft / container.offsetWidth);
    if (newIndex !== currentIndex) {
      currentIndex = newIndex;
      actualizarIndicadores(currentIndex, semanas.length);
    }
  });
}

function actualizarIndicadores(actual, total) {
  const indicator = document.getElementById('scrollIndicator');
  if (!indicator || total <= 1) {
    indicator.innerHTML = '';
    return;
  }
  indicator.innerHTML = Array(total).fill(0).map((_, i) =>
    `<div class="dot ${i === actual ? 'active' : ''}"></div>`
  ).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.filter;
    renderizar();
  });
});

cargarPartidos();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') cargarPartidos();
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) cargarPartidos();
});
window.addEventListener('focus', () => cargarPartidos());
</script>
</body>
</html>
