name: Actualizar Partidos

# La FCF bloquea las IPs de GitHub (403), así que los datos los sube el iPhone
# (Atajo) a entrada/ y luego lanza este workflow con workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar partidos y escudos [skip ci]"
            git pull --rebase origin main
            git push
          fi
