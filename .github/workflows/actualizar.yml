name: Actualizar Partidos

on:
  schedule:
    - cron: '0 6,12,18 * * 1-5'
    - cron: '0 */2 * * 0,6'
  workflow_dispatch:

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Mostrar archivos generados
        run: |
          echo "=== PARTIDOS.JSON ==="
          ls -lh partidos.json
          echo "=== ESCUDOS ==="
          if [ -d "escudos" ]; then
            find escudos -maxdepth 1 -type f -print | sort
          else
            echo "No existe carpeta escudos"
          fi

      - name: Guardar cambios en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add partidos.json
          if [ -d "escudos" ]; then
            git add escudos/
          fi
          if git diff --staged --quiet; then
            echo "No hay cambios que guardar."
          else
            echo "Hay cambios. Creando commit..."
            git commit -m "Actualizar partidos y escudos [skip ci]"
            git pull --rebase origin main
            git push
          fi
