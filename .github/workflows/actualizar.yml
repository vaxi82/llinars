name: Actualizar Partidos

on:
  schedule:
    # Se ejecuta de lunes a viernes cada 6 horas y los fines de semana cada 2 horas
    - cron: '0 6,12,18 * * 1-5'
    - cron: '0 */2 * * 0,6'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add partidos.json
          
          # Hacer commit solo si partidos.json ha cambiado
          if git diff --staged --quiet; then
            echo "No hay cambios en partidos.json"
          else
            git commit -m "Actualizar datos de partidos [skip ci]"
            git pull --rebase origin main
            git push
          fi
