name: Actualizar Partidos

on:
  schedule:
    - cron: '0 6,12,18 * * 1-5'
    - cron: '0 */2 * * 0,6'
  workflow_dispatch:

# Necesario para que el job pueda hacer git push con el GITHUB_TOKEN
permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper.py

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add partidos.json
          [ -d escudos ] && git add escudos/
          if git diff --staged --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar partidos y escudos [skip ci]"
            git pull --rebase origin main
            git push
          fi
